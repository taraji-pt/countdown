<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101316"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Countdown"><meta name="description" content="Até a loucura passar. Basta a cada dia o seu mal."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon.svg"><title>Countdown</title>
<style>
:root{color-scheme:dark;--bg:#101316;--ink:#f3f0e8;--muted:#89939a;--accent:#d9a85f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{min-height:100svh;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom))}main{width:min(100%,900px);text-align:center}.eyebrow{color:var(--accent);font-size:clamp(10px,2vw,13px);letter-spacing:.28em;text-transform:uppercase;margin-bottom:clamp(22px,5vh,48px)}h1{font-size:clamp(18px,3vw,25px);font-weight:500;letter-spacing:.12em;margin:0 0 12px}.target{color:var(--muted);font-size:clamp(11px,2vw,14px);letter-spacing:.13em;margin-bottom:clamp(28px,6vh,58px)}.clock{display:grid;grid-template-columns:minmax(0,1fr);gap:0;max-width:560px;margin:0 auto}.unit{min-width:0}.unit .digit{color:var(--accent);border-color:#8d6a3b;text-shadow:0 2px 0 #000,0 0 12px #d9a85f33}.digits{display:flex;justify-content:center;gap:clamp(2px,.6vw,6px)}.digit{position:relative;flex:1;min-width:0;max-width:104px;height:clamp(66px,15vw,138px);display:grid;place-items:center;background:linear-gradient(#30383e 0 49.2%,#111518 49.2% 50.8%,#252c31 50.8%);border:1px solid #394147;border-radius:5px;box-shadow:0 8px 20px #0007,inset 0 1px #ffffff12;font-size:clamp(34px,9vw,82px);line-height:1;font-weight:600;letter-spacing:-.08em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000;overflow:hidden}.digit:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#080b0d;box-shadow:0 1px #ffffff12}.digit.changed{animation:tick .22s ease-out}@keyframes tick{0%{filter:brightness(1.55);transform:translateY(-2px)}100%{filter:brightness(1);transform:translateY(0)}}.label{color:var(--muted);font-size:clamp(9px,1.8vw,12px);letter-spacing:.2em;margin-top:13px}.message{margin-top:clamp(38px,8vh,76px);color:var(--accent);font-size:clamp(12px,2.4vw,16px);letter-spacing:.2em}.submessage{margin-top:10px;color:var(--muted);font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.04em}.footer{margin-top:clamp(28px,6vh,52px);color:#566168;font-size:10px;letter-spacing:.12em}@media(max-width:420px){body{padding-left:12px;padding-right:12px}.clock{gap:12px 5px}.digit{height:68px;font-size:clamp(30px,8.8vw,40px)}.label{letter-spacing:.12em}}@media(max-height:520px){.eyebrow{margin-bottom:12px}.target{margin-bottom:18px}.message{margin-top:20px}.footer{margin-top:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="eyebrow">A contagem começou</div><h1>ATÉ A LOUCURA PASSAR</h1><div class="target">31 MAIO 2027 · 00:00</div><section class="clock" aria-label="Dias restantes"><div class="unit"><div class="digits" id="days"></div><div class="label">DIAS</div></div></section><div class="message">BASTA A CADA DIA O SEU MAL.</div></main>
<script>
const target=new Date(2027,4,31,0,0,0,0),previous={};function update(){const days=Math.max(0,Math.ceil((target.getTime()-Date.now())/86400000)),s=String(days).padStart(3,"0"),el=document.getElementById("days");if(previous.days!==s){el.innerHTML=[...s].map((n,i)=>'<span class="digit'+(previous.days&&previous.days[i]!==n?' changed':'')+'">'+n+'</span>').join("");previous.days=s}if(Date.now()>=target.getTime()){document.querySelector("h1").textContent="CHEGOU O DIA!";document.querySelector(".message").textContent="CONSEGUISTE. PARABÉNS!"}}update();setInterval(update,60000);if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
